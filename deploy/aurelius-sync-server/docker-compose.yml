# Generic, self-hostable deployment unit for aurelius-sync-server — anyone
# can copy this directory and run their own private instance, no code
# changes needed. Configure via .env (copy .env.example) before first run.
#
#   cp deploy/aurelius-sync-server/.env.example deploy/aurelius-sync-server/.env
#   docker compose -f deploy/aurelius-sync-server/docker-compose.yml up -d --build
#
# Run from the repository root (or any cwd) — the build context below is
# pinned to the workspace root regardless of where this file is invoked
# from, since aurelius-sync-server needs the whole workspace to build.
services:
  aurelius-sync-server:
    build:
      context: ../..
      dockerfile: deploy/aurelius-sync-server/Dockerfile
    image: aurelius-sync-server:latest
    restart: unless-stopped
    ports:
      - "${AURELIUS_SYNC_PORT:-8181}:8181"
    environment:
      # Required — protects POST /sync/grants and /sync/grants/revoke.
      # Generate your own, e.g.: openssl rand -hex 32
      - AURELIUS_SYNC_ADMIN_TOKEN=${AURELIUS_SYNC_ADMIN_TOKEN:?set AURELIUS_SYNC_ADMIN_TOKEN in .env}
    volumes:
      - aurelius-sync-data:/data
    command: ["--port", "8181", "--db", "/data/aurelius-sync-server.db"]

volumes:
  aurelius-sync-data:
