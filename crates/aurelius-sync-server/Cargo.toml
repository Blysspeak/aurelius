[package]
name = "aurelius-sync-server"
description = "Self-hosted HTTP sync server for Aurelius project sharing"

[package.version]
workspace = true
[package.edition]
workspace = true
[package.license]
workspace = true
[package.authors]
workspace = true
[package.repository]
workspace = true

[lib]
name = "aurelius_sync_server"
path = "src/lib.rs"

[[bin]]
name = "aurelius-sync-server"
path = "src/main.rs"

[dependencies]
aurelius-core = { path = "../aurelius-core" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
